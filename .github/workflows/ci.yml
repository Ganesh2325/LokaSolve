name: ci

on:
  push:
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.5
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      ENV: test
      MIGRATE_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
      TEST_DATABASE_URL: postgres://lokasolve_app:lokasolve_app@localhost:5432/lokasolve_test?sslmode=disable
      REDIS_URL: redis://localhost:6379/0
      AUTH_TOKEN_SECRET: test-token-secret-must-be-at-least-32
      OTP_PEPPER: test-otp-pepper-must-be-at-least-32b
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
      - name: Unit tests
        working-directory: services/api-go
        run: go test ./...
      - name: Integration tests
        working-directory: services/api-go
        run: go test -tags integration ./...

  ai:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tests
        working-directory: services/ai-python
        run: |
          python -m pip install -r requirements.txt
          python -m pytest

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run lint -w @lokasolve/web
      - run: npm run build -w @lokasolve/web
        env:
          API_PROXY_TARGET: http://127.0.0.1:8080
